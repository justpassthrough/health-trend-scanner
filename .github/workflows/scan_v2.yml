name: Health Trend Scan v2

on:
  # 2026-09-17: 자동 스케줄은 미니PC 로컬 실행(scripts/run_local.py, 작업 스케줄러 Auto_TrendScan 08:00·20:00)으로 옮김.
  #   이유: AI 분석을 구독제 Claude CLI(Opus)로 돌려 API 과금을 없애고, 집 IP 에서 실제 검색 화면도 확인하려고.
  #   여기는 수동 실행용으로만 남긴다(미니PC 가 죽었을 때 비상용 — 이 경우 Anthropic API(Haiku)로 과금되고 검색 화면 확인은 빠진다).
  # schedule:
  #   - cron: '0 23 * * *'    # KST 08:00
  #   - cron: '0 11 * * *'    # KST 20:00
  workflow_dispatch:          # 수동 실행

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan v2
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
        run: python scripts/collect_v2.py

      - name: Build dashboard v2
        run: python scripts/build_dashboard_v2.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "scan v2: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git push
